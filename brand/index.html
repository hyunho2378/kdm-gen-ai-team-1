<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 웹폰트. **SUIT가 본문이고 Pretendard는 폴백이다**(tokens의 family가 그 순서다).
         SUIT는 presentation-v2가 이미 쓰는 것과 같은 CDN과 같은 버전이라 두 앱의 얼굴이 같다.
         가변 축이 정상이라 굵기를 합성하지 않는다(합성 굵기는 글자를 찌그러뜨린다).
         미로드 시 tokens의 시스템 fallback으로 내려앉는다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>VORTEX Brand</title>
    <!-- **첫 페인트부터 v2 배경으로 둔다(BV2-1).** 스타일시트가 붙기 전 한 프레임이
         다른 색으로 번쩍이는 것을 막는다(실측 스크린샷에서 잡았다).
         값은 BRAND_SITE_V2_PLAN 1절 배경 그라디언트와 같고 index.css의 부트스트랩 예외와 같은 지위다.

         **body에는 배경을 주지 않는다.** `scrollbar-gutter`가 비워 둔 좌우 띠를 칠하는 것은
         html이라, body에 두면 화면 위쪽 양 가장자리만 다른 색으로 뜬다(실측으로 잡았다). -->
    <style>
      html, body { margin: 0; }
      html { background: linear-gradient(180deg, #C1C1C1 0%, #F6F6F6 100%); background-attachment: fixed; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
