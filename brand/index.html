<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>VORTEX Brand</title>
    <!-- **첫 페인트부터 v2 배경으로 둔다(BV2-1).** 스타일시트가 붙기 전 한 프레임이
         다른 색으로 번쩍이는 것을 막는다(실측 스크린샷에서 잡았다).
         값은 BRAND_SITE_V2_PLAN 1절 배경 그라디언트와 같고 index.css의 부트스트랩 예외와 같은 지위다.

         **body에는 배경을 주지 않는다.** `scrollbar-gutter`가 비워 둔 좌우 띠를 칠하는 것은
         html이라, body에 두면 화면 위쪽 양 가장자리만 다른 색으로 뜬다(실측으로 잡았다). -->
    <style>
      html, body { margin: 0; }
      html { background: linear-gradient(180deg, #C1C1C1 0%, #F6F6F6 100%); background-attachment: fixed; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
